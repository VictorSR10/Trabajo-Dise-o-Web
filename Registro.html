<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Registro - B.O.U.</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .registro-contenedor {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        .grupo-control {
            margin-bottom: 15px;
        }
        .grupo-control label {
            display: block;
            margin-bottom: 5px;
            color: #555555;
            font-size: 14px;
            font-weight: 500;
        }
        .grupo-control input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .grupo-control input:focus {
            border-color: #4caf50;
            outline: none;
        }
        .error-mensaje {
            color: #de3d3d;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .btn-registro {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 5px;
        }
        .btn-registro:hover {
            background-color: #45a049;
        }
        .exito-mensaje {
            color: #2e7d32;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
            margin-top: 15px;
            font-size: 14px;
        }
        .enlaces-secundarios {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .enlaces-secundarios a {
            color: #4caf50;
            text-decoration: none;
            font-weight: 600;
        }
        .enlaces-secundarios a:hover {
            text-decoration: underline;
        }
        .volver-inicio {
            display: block;
            margin-top: 10px;
            color: #888;
            font-size: 13px;
            text-decoration: none;
        }
        .volver-inicio:hover {
            color: #555;
        }
    </style>
  
    <!-- CDN oficial de jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="accesibilidad.css">
</head>
<body>

<div class="registro-contenedor">
    <h2>Crear Cuenta</h2>
    <form id="formRegistro">
        <div class="grupo-control">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">
            <div id="errorNombre" class="error-mensaje">Por favor, introduce tu nombre (mínimo 3 caracteres).</div>
        </div>

        <div class="grupo-control">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
            <div id="errorCorreo" class="error-mensaje">Introduce un correo electrónico válido.</div>
        </div>

        <div class="grupo-control">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
            <div id="errorPassword" class="error-mensaje">La contraseña debe tener al menos 6 caracteres.</div>
        </div>

        <div class="grupo-control">
            <label for="confirmarPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contraseña">
            <div id="errorConfirmar" class="error-mensaje">Las contraseñas no coinciden.</div>
        </div>

        <button type="submit" class="btn-registro">Registrarse</button>
    </form>
    
    <div id="mensajeExito" class="exito-mensaje">¡Registro completado con éxito!</div>

    <div class="enlaces-secundarios">
        ¿Ya tienes una cuenta? <a href="Imiciosesion.html">Inicia sesión aquí</a>
        <a href="index.html" class="volver-inicio">← Volver al inicio</a>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#formRegistro').on('submit', function(e) {
        e.preventDefault(); 
        
        $('.error-mensaje').hide();
        $('#mensajeExito').hide();
        var esValido = true;

        var nombre = $('#nombre').val().trim();
        var correo = $('#correo').val().trim();
        var password = $('#password').val();
        var confirmarPassword = $('#confirmarPassword').val();

        // 1. Validar nombre
        if (nombre === '' || nombre.length < 3) {
            $('#errorNombre').fadeIn();
            esValido = false;
        }

        // 2. Validar formato de correo
        var expresionCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!expresionCorreo.test(correo)) {
            $('#errorCorreo').text('Introduce un correo electrónico válido.').fadeIn();
            esValido = false;
        }

        // 3. Validar longitud de contraseña
        if (password.length < 6) {
            $('#errorPassword').fadeIn();
            esValido = false;
        }

        // 4. Validar confirmación de contraseña
        if (password !== confirmarPassword) {
            $('#errorConfirmar').fadeIn();
            esValido = false;
        }

        // 5. Si todo es válido, comprobar duplicados y guardar en localStorage
        if (esValido) {
            var usuarios = [];
            try {
                usuarios = JSON.parse(localStorage.getItem('usuarios_bou')) || [];
            } catch (err) {
                usuarios = [];
            }

            var existe = usuarios.some(function(u) {
                return u.correo && u.correo.toLowerCase() === correo.toLowerCase();
            });

            if (existe) {
                $('#errorCorreo').text('Este correo ya se encuentra registrado. Inicia sesión.').fadeIn();
                return;
            }

            usuarios.push({
                nombre: nombre,
                correo: correo,
                password: password,
                fechaRegistro: new Date().toISOString()
            });

            localStorage.setItem('usuarios_bou', JSON.stringify(usuarios));

            $('#mensajeExito').text('¡Registro exitoso! Redirigiendo al inicio de sesión...').fadeIn();
            $('#formRegistro')[0].reset();

            setTimeout(function() {
                window.location.href = 'Imiciosesion.html';
            }, 1400);
        }
    });
});
</script>

    <script src="accesibilidad.js"></script>
</body>
</html>
